[package]
name    = "rust-docs-learn"
version = "0.1.0"
edition = "2024"
publish = false

# كل درس = ملف في examples/  →  cargo run --example <اسم الملف>
# الـ dependencies دي زي dependencies في package.json بالظبط
[dependencies]
tokio      = { version = "1.53", features = ["full"] }
futures    = "0.3"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }

# قواعد البيانات
sqlx    = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json", "uuid", "chrono"] }
mongodb = "3.9"

# RabbitMQ
lapin = "4.10"
