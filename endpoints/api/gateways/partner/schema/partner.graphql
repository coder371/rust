"""
الشريك بيشوف بيانات التواصل بس — مفيش راتب ولا ملاحظات.
"""
type Customer {
	id: ID!
	name: String!
	email: String!
}

"""
عرض الفلوس في السكيما: السنت للحسابات، والنص للعرض.
"""
type Money {
	cents: Int!
	formatted: String!
}

type Order {
	id: ID!
	customerId: ID!
	total: Money!
	status: OrderStatus!
}

enum OrderStatus {
	PENDING
	PAID
	CANCELLED
}

input PageInput {
	offset: Int
	limit: Int
}

type Query {
	"""
	أوردرات الشريك الحالي بس — الفلترة بالـ tenant جوّه اللوجيك.
	"""
	myOrders(page: PageInput): [Order!]!
	orderCustomer(orderId: ID!): Customer!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: Query
}
