[package]
name = "chat-backend"
version = "0.1.0"
edition = "2024"

# مشروع مستقل، مش عضو في workspace الأب
[workspace]

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
